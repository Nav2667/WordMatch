<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matching Words Exercise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Matching Words Exercise</h1>
  <div id="progress-container">
    <div id="progress-bar"></div>
    <div id="milestone-container">
      <div class="milestone" id="milestone-6">6</div>
      <div class="milestone" id="milestone-12">12</div>
      <div class="milestone" id="milestone-18">18</div>
    </div>
  </div>
  
  <div class="container">
    <ul class="words-list" id="list1">
      <!-- Words in your target language will be populated here -->
    </ul>
    <ul class="words-list" id="list2">
      <!-- Translations will be populated here -->
    </ul>
  </div>
  
  <script src="script.js"></script>
</body>

</html>
